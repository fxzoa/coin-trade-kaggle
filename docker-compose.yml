services:
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: nanbingjun/top20-tracker-worker:latest
    container_name: top20-tracker-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - ./conf/top20_worker/.env
    environment:
      - DB_PATH=/app/data/tracker.db

  webui:
    build:
      context: .
      dockerfile: docker/Dockerfile.webui
    image: nanbingjun/top20-tracker-webui:latest
    container_name: top20-tracker-webui
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
    env_file:
      - ./conf/top20_webui/.env
    environment:
      - PORT=8003
      - DB_PATH=/app/data/tracker.db
    depends_on:
      - worker
    healthcheck:
      test: ["CMD-SHELL", "deno eval \"const res = await fetch('http://localhost:8003/health'); if (!res.ok) Deno.exit(1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  price-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.price-monitor
    image: nanbingjun/price-change-monitor:latest
    container_name: price-change-monitor
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - ./conf/price_monitor/.env
    environment:
      - REDIS_URL=redis://redis-tunnel:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-tunnel:
        condition: service_healthy

  price-monitor-webui:
    build:
      context: .
      dockerfile: docker/Dockerfile.price-monitor-webui
    image: nanbingjun/price-change-monitor-webui:latest
    container_name: price-change-monitor-webui
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - ./data:/app/data
    env_file:
      - ./conf/price_monitor_webui/.env
    environment:
      - REDIS_URL=redis://redis-tunnel:6379
      - PORT=8005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      price-monitor:
        condition: service_started
      redis-tunnel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "deno eval \"const res = await fetch('http://localhost:8005/api/health'); if (!res.ok) Deno.exit(1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard-webui:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard-webui
    image: nanbingjun/hl-dashboard-webui:latest
    container_name: hl-dashboard-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./conf/dashboard_webui/.env
    environment:
      - REDIS_URL=redis://redis-tunnel:6379
      - PORT=8080
      - HOST=0.0.0.0
      - URL_PRICE_SYNCER=http://price-monitor-webui:8005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      price-monitor-webui:
        condition: service_started
      redis-tunnel:
        condition: service_healthy

  btc-dca-bot:
